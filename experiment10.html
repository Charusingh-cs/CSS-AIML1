<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaMart Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* NAVBAR */
        .navbar {
            background-color: #0066cc;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* ---------- RESPONSIVE DESIGN ---------- */
        @media (max-width: 600px) {
            .nav-links {
                display: block;
                background-color:red;
                text-align: center;
                padding: 10px 0;
            }

            .nav-links a {
                display: block;
                padding: 10px 0;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">MegaMart</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Categories</a>
            <a href="#">Deals</a>
            <a href="#">Support</a>
        </div>
    </div>

</body>
</html>
